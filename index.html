<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10261f">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --baize:#10261f; --baize-deep:#0a1814; --brass:#c9a45c; --brass-soft:#8f7440;
  --ivory:#efe8d8; --mute:#a9b3a6;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Jost",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:radial-gradient(120% 90% at 50% 38%,var(--baize) 0%,var(--baize-deep) 100%);
  color:var(--ivory);font-family:var(--sans);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 56px) 24px calc(env(safe-area-inset-bottom,0px) + 40px);
  text-align:center;overflow:hidden;
}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(44px,12vw,64px);letter-spacing:.04em;color:var(--ivory)}
.sub{font-family:var(--serif);font-size:20px;color:var(--brass);margin-top:6px}

.stage{position:relative;width:min(72vw,280px);aspect-ratio:1;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--brass)}
.ring.r2{inset:14%;border-color:var(--brass-soft)}
.ring.r3{inset:28%;border-color:var(--brass-soft);opacity:.6}
.core{width:30%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e6c98a,var(--brass) 55%,var(--brass-soft));
  box-shadow:0 0 40px rgba(201,164,92,.25)}

body[data-state="connecting"] .ring{border-style:dashed;animation:spin 6s linear infinite}
body[data-state="connecting"] .ring.r2{animation-direction:reverse}
body[data-state="listening"] .ring{animation:breathe 4s ease-in-out infinite}
body[data-state="listening"] .ring.r2{animation-delay:.4s}
body[data-state="listening"] .ring.r3{animation-delay:.8s}
body[data-state="speaking"] .core{animation:glow 1.1s ease-in-out infinite}
body[data-state="speaking"] .ring{animation:ripple 1.6s ease-out infinite}
body[data-state="speaking"] .ring.r2{animation-delay:.25s}
body[data-state="speaking"] .ring.r3{animation-delay:.5s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes ripple{0%{transform:scale(.94);opacity:1}100%{transform:scale(1.12);opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.bottom{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%}
#status{font-family:var(--serif);font-size:24px;min-height:34px;max-width:30ch}
#said{font-family:var(--serif);font-size:18px;color:var(--mute);max-width:32ch;min-height:48px;line-height:1.35}
#status.err{font-family:var(--sans);font-size:15px;color:#e8b4a0;line-height:1.45}
button{
  font:500 17px var(--sans);letter-spacing:.02em;color:var(--baize-deep);background:var(--brass);
  border:0;border-radius:999px;padding:16px 34px;min-width:230px;cursor:pointer;
  transition:background .2s,transform .1s;
}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid var(--ivory);outline-offset:3px}
button:disabled{opacity:.6}
body[data-state="listening"] button,body[data-state="speaking"] button{background:transparent;color:var(--ivory);border:1.5px solid var(--brass-soft)}
</style>
</head>
<body data-state="idle">
<header>
  <h1>Jarvis</h1>
  <p class="sub">Zu Ihren Diensten</p>
</header>

<div class="stage" aria-hidden="true">
  <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"></div>
</div>

<div class="bottom">
  <p id="status" role="status" aria-live="polite">Zu Diensten.</p>
  <p id="said" aria-live="polite"></p>
  <button id="btn" type="button">Gespräch beginnen</button>
</div>

<script type="module">
import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm";

const AGENT_ID = "agent_0101m43qkcwae9r8jvbq9xfyrtmb";
const btn = document.getElementById("btn");
const statusEl = document.getElementById("status");
let conv = null;

function setState(state, text, isErr = false) {
  document.body.dataset.state = state;
  statusEl.textContent = text;
  statusEl.classList.toggle("err", isErr);
}
function reset() {
  conv = null;
  btn.textContent = "Gespräch beginnen";
  btn.disabled = false;
}

const said = document.getElementById("said");

// iOS: Audio muss innerhalb des Tippens freigeschaltet werden (auch bei Stumm-Schalter).
function unlockAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC(); ctx.resume();
    const src = ctx.createBufferSource();
    src.buffer = ctx.createBuffer(1, 1, 22050);
    src.connect(ctx.destination); src.start(0);
  } catch (e) {}
  try {
    const a = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=");
    a.play().catch(() => {});
  } catch (e) {}
}

btn.addEventListener("click", async () => {
  if (conv) { await conv.endSession(); return; }
  unlockAudio();
  said.textContent = "";
  setState("connecting", "Einen Moment bitte …");
  btn.disabled = true;
  try {
    conv = await Conversation.startSession({
      agentId: AGENT_ID,
      connectionType: "webrtc",
      onConnect: () => {
        setState("listening", "Ich höre zu.");
        btn.textContent = "Gespräch beenden";
        btn.disabled = false;
      },
      onDisconnect: () => { reset(); setState("idle", "Zu Diensten."); },
      onModeChange: ({ mode }) => {
        if (mode === "speaking") setState("speaking", "Jarvis spricht.");
        else setState("listening", "Ich höre zu.");
      },
      onMessage: ({ source, message }) => { if (source === "ai") said.textContent = message; },
      onError: (m) => { reset(); setState("idle", "Fehler: " + (m && m.message ? m.message : m), true); }
    });
    if (conv.setVolume) conv.setVolume({ volume: 1 });
  } catch (e) {
    reset();
    const denied = e && (e.name === "NotAllowedError" || e.name === "SecurityError");
    setState("idle", denied
      ? "Das Mikrofon ist blockiert. Erlaube es in Safari unter „Einstellungen für diese Website“ und lade die Seite neu."
      : "Keine Verbindung zu Jarvis: " + (e && e.message ? e.message : e), true);
  }
});
</script>
</body>
</html>
